  <text x="126" y="164" font-family="ui-monospace,monospace" font-size="11" fill="#a1a1aa">ops@198.51.100.7:2202 🔒</text>
  <text x="330" y="164" font-family="system-ui,sans-serif" font-size="11" fill="#71717a">非当前</text>
  <rect x="500" y="146" width="52" height="26" rx="6" fill="#27272a" stroke="#3f3f46"/>
