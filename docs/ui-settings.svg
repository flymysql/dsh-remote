<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430">
  <rect width="760" height="430" fill="#18181b"/>
  <text x="20" y="34" font-family="system-ui,sans-serif" font-size="16" fill="#fafafa" font-weight="600">远程工作区（dsh-remote）— 多机 SSH 列表</text>
  <text x="20" y="56" font-family="system-ui,sans-serif" font-size="11" fill="#a1a1aa">维护多台 SSH 机器，密码本地保存；工作区路径在选工作区时选。</text>

  <!-- 已配置 -->
  <rect x="20" y="72" width="720" height="148" rx="8" fill="#1f1f23" stroke="#3f3f46"/>
