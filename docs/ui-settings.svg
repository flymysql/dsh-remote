  <text x="669" y="123" font-family="system-ui,sans-serif" font-size="11" fill="#fff" text-anchor="middle">设为当前</text>
  <!-- m2 -->
  <rect x="34" y="142" width="692" height="34" rx="6" fill="none" stroke="#3f3f46"/>
