<svg xmlns="http://www.w3.org/2000/svg" width="880" height="560" viewBox="0 0 880 560" font-family="system-ui,sans-serif">
  <rect width="880" height="560" fill="#151517"/>

  <!-- page title & subtitle -->
  <text x="24" y="44" font-size="16" fill="#f4f4f5" font-weight="600">远程工作区</text>
  <text x="24" y="66" font-size="12" fill="#9ca3af">管理多台 SSH 机器；密码本地保存、界面不回显。工作区路径在「添加工作区」弹窗里选择。</text>

  <!-- configured machines -->
  <text x="24" y="100" font-size="13" fill="#e4e4e7" font-weight="600">已配置机器</text>

  <!-- machine row 1 -->
  <rect x="24" y="112" width="700" height="38" rx="8" fill="#1e1e22" stroke="#3a3a40"/>
  <circle cx="46" cy="131" r="5" fill="#4caf50"/>
  <text x="62" y="136" font-size="13" fill="#e4e4e7" font-weight="600">deploy-01</text>
  <text x="150" y="136" font-size="12" fill="#a1a1aa">root@203.0.113.10:22</text>
  <text x="360" y="136" font-size="11" fill="#4caf50">● 当前</text>
  <text x="440" y="136" font-size="12" fill="#ef5350">删除</text>
  <text x="500" y="136" font-size="12" fill="#3b82f6">设当前</text>
  <text x="576" y="136" font-size="12" fill="#e48fbf">镜像…</text>

  <!-- machine row 2 -->
  <rect x="24" y="158" width="700" height="38" rx="8" fill="#1e1e22" stroke="#3a3a40"/>
  <circle cx="46" cy="177" r="5" fill="#6b7280"/>
  <text x="62" y="182" font-size="13" fill="#e4e4e7" font-weight="600">build-02</text>
  <text x="150" y="182" font-size="12" fill="#a1a1aa">ops@198.51.100.7:2202 🔒</text>
  <text x="360" y="182" font-size="11" fill="#6b7280">非当前</text>
  <text x="440" y="182" font-size="12" fill="#ef5350">删除</text>
  <text x="500" y="182" font-size="12" fill="#a1a1aa">设当前</text>
  <text x="576" y="182" font-size="12" fill="#a0a0a0">镜像…</text>

  <!-- footer note -->
  <text x="24" y="230" font-size="11" fill="#6b7280">主机均为占位示例（不暴露真实内网地址）；密码只存本地、不回显。</text>
</svg>