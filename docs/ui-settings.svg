  <text x="126" y="124" font-family="ui-monospace,monospace" font-size="11" fill="#a1a1aa">user@203.0.113.10:22</text>
  <text x="330" y="124" font-family="system-ui,sans-serif" font-size="11" fill="#4caf7d">· 当前</text>
  <rect x="500" y="106" width="52" height="26" rx="6" fill="#27272a" stroke="#3f3f46"/>
