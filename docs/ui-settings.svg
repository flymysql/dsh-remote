<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420">
  <rect width="760" height="420" fill="#18181b"/>
  <text x="20" y="34" font-family="system-ui,sans-serif" font-size="16" fill="#fafafa" font-weight="600">远程工作区（dsh-remote）— 多机 SSH 列表</text>
  <text x="20" y="56" font-family="system-ui,sans-serif" font-size="11" fill="#a1a1aa">维护多台 SSH 机器，密码本地保存；工作区路径在新建/选择工作区时选。</text>

  <!-- 已配置机器 -->
  <rect x="20" y="74" width="720" height="150" rx="8" fill="#1f1f23" stroke="#3f3f46"/>
  <text x="34" y="96" font-family="system-ui,sans-serif" font-size="12" fill="#e4e4e7" font-weight="600">已配置机器</text>
  <!-- machine 1 -->
  <rect x="34" y="104" width="692" height="32" rx="6" fill="none" stroke="#3f3f46"/>
  <text x="46" y="125" font-family="ui-monospace,monospace" font-size="12" fill="#e4e4e7">编译机1</text>
  <text x="120" y="125" font-family="ui-monospace,monospace" font-size="11" fill="#a1a1aa">jimmycppliu@10.0.0.8:22</text>
  <text x="330" y="125" font-family="system-ui,sans-serif" font-size="11" fill="#4caf7d">· 当前</text>
  <rect x="520" y="109" width="52" height="22" rx="6" fill="#27272a" stroke="#3f3f46"/><text x="538" y="124" font-family="system-ui,sans-serif" font-size="11" fill="#e4e4e7">编辑</text>
  <rect x="580" y="109" width="52" height="22" rx="6" fill="#4c2a2a" stroke="#7f1d1d"/><text x="598" y="124" font-family="system-ui,sans-serif" font-size="11" fill="#fca5a5">删除</text>
  <!-- machine 2 -->
  <rect x="34" y="142" width="720" height="32" rx="6" fill="none" stroke="#3f3f46"/>
  <text x="46" y="163" font-family="ui-monospace,monospace" font-size="12" fill="#e4e4e7">编译机2</text>
  <text x="120" y="163" font-family="ui-monospace,monospace" font-size="11" fill="#a1a1aa">root@9.134.186.191:36000 🔒</text>
  <rect x="456" y="147" width="52" height="22" rx="6" fill="#27272a" stroke="#3f3f46"/><text x="474" y="162" font-family="system-ui,sans-serif" font-size="11" fill="#e4e4e7">编辑</text>
  <rect x="580" y="147" width="52" height="22" rx="6" fill="#4c2d2a" stroke="#7f1d1d"/><text x="598" y="162" font-family="system-ui,sans-serif" font-size="11" fill="#fca5a5">删除</text>

  <!-- 添加机器 -->
  <rect x="20" y="236" width="720" height="150" rx="8" fill="#1f1f23" stroke="#3f3f46"/>
  <text x="34" y="258" font-family="system-ui,sans-serif" font-size="12" fill="#e4e4e7" font-weight="600">添加机器</text>
  <text x="40" y="296" font-family="system-ui,sans-serif" font-size="11" fill="#a1a1aa">名称</text>
  <rect x="120" y="278" width="180" height="24" rx="6" fill="#27272a" stroke="#3f3f46"/>
  <text x="40" y="332" font-family="system-ui,sans-serif" font-size="11" fill="#a1a1aa">主机</text>
  <rect x="120" y="316" width="180" height="24" rx="6" fill="#27272a" stroke="#3f3f46"/>
  <text x="340" y="332" font-family="system-ui,sans-serif" font-size="11" fill="#a1a1aa">端口</text>
  <rect x="420" y="316" width="80" height="24" rx="6" fill="#27272a" stroke="#3f3f46"/>
  <text x="570" y="332" font-family="system-ui,sans-serif" font-size="11" fill="#a1a1aa">用户</text>
  <rect x="640" y="316" width="86" height="24" rx="6" fill="#27272a" stroke="#3f3f46"/>
  <rect x="120" y="256" width="0" height="0" />
  <rect x="572" y="256" width="0" height="0" />
  <text x="480" y="270" font-family="ui-monospace,monospace" font-size="11" fill="#a1a1aa">密码 / 私钥（保存）</text>
  <rect x="622" y="254" width="106" height="24" rx="6" fill="#2563eb" stroke="none"/>
  <text x="650" y="270" font-family="system-ui,sans-serif" font-size="11" fill="#fff">保存</text>
</svg>