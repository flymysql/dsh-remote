  <rect x="562" y="146" width="52" height="26" rx="6" fill="#4c2d2a" stroke="#7f1d1d"/>
  <text x="588" y="163" font-family="system-ui,sans-serif" font-size="11" fill="#fca5a5" text-anchor="middle">删除</text>
  <rect x="624" y="146" width="90" height="26" rx="6" fill="#27272a" stroke="#3f3f46"/>
  <text x="669" y="163" font-family="system-ui,sans-serif" font-size="11" fill="#e4e4e7" text-anchor="middle">设为当前</text>

  <!-- 添加 -->
  <rect x="20" y="228" width="720" height="150" rx="8" fill="#1f1f23" stroke="#3f3f46"/>
