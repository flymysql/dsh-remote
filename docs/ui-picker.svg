<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420">
  <rect width="720" height="420" fill="#18181b"/>
  <text x="18" y="34" font-family="system-ui,sans-serif" font-size="14" fill="#fafafa" font-weight="600">选择工作区</text>

  <!-- tabs -->
  <rect x="18" y="48" width="64" height="26" rx="6" fill="#2563eb"/><text x="34" y="66" font-family="system-ui,sans-serif" font-size="12" fill="#fff" font-weight="600">本机</text>
  <rect x="88" y="48" width="64" height="26" rx="6" fill="#27272a" stroke="#3f3f46"/><text x="104" y="66" font-family="system-ui,sans-serif" font-size="12" fill="#e4e4e7">远程</text>

  <!-- 本机 tab body -->
  <rect x="18" y="86" width="520" height="90" rx="8" fill="#1f1f23" stroke="#3f3f46"/>
  <text x="32" y="108" font-family="system-ui,sans-serif" font-size="11" fill="#a1a1aa">系统选择器优先；随时可直接输入本机目录</text>
  <rect x="32" y="120" width="260" height="24" rx="6" fill="#27272a" stroke="#3f3f46"/>
  <rect x="306" y="120" width="90" height="24" rx="6" fill="#2563eb"/><text x="322" y="136" font-family="system-ui,sans-serif" font-size="11" fill="#fff">选用此本地路径</text>
  <rect x="408" y="120" width="118" height="24" rx="6" fill="#27272a" stroke="#3f3f46"/><text x="436" y="136" font-family="system-ui,sans-serif" font-size="10" fill="#e4e4e7">打开系统文件夹选择器</text>
  <text x="32" y="160" font-family="system-ui,sans-serif" font-size="10" fill="#71717a">点击后走 dsh-remote host 的原生文件夹对话框直接选目录</text>

  <!-- 远程 tab (outline, ghost) -->
  <rect x="18" y="188" width="520" height="200" rx="8" fill="#1f1f23" stroke="#3f3f46" opacity="0.55"/>
  <text x="32" y="212" font-family="system-ui,sans-serif" font-size="11" fill="#a1a1aa">远程机器</text>
  <rect x="96" y="198" width="150" height="22" rx="6" fill="#27272a" stroke="#3f3f46"/>
  <text x="108" y="212" font-family="ui-monospace,monospace" font-size="10" fill="#e4e4e7">▾ 编译机1</text>
  <text x="270" y="212" font-family="ui-monospace,monospace" font-size="11" fill="#71717a">jimmycppliu@10.0.0.8:22</text>
  <rect x="440" y="206" width="52" height="22" rx="6" fill="#27272a" stroke="#3f3f46"/><text x="458" y="221" font-family="system-ui,sans-serif" font-size="11" fill="#e4e4e7">载入</text>
  <rect x="506" y="206" width="52" height="22" rx="6" fill="#27272a" stroke="#3f3f46"/><text x="524" y="221" font-family="system-ui,sans-serif" font-size="11" fill="#e4e4e7">上一级</text>

  <!-- dir list -->
  <rect x="32" y="240" width="508" height="110" rx="6" fill="#17171a" stroke="#3f3f46"/>
  <text x="44" y="262" font-family="system-ui,sans-serif" font-size="11" fill="#4caf7d">📁 src</text>
  <text x="44" y="284" font-family="system-ui,sans-serif" font-size="11" fill="#4caf7d">📁 docs</text>
  <text x="44" y="306" font-family="system-ui,sans-serif" font-size="11" fill="#4caf7d">📁 tests</text>
  <text x="44" y="328" font-family="system-ui,sans-serif" font-size="11" fill="#e4e4e7">📄 package.json</text>
  <text x="44" y="342" font-family="system-ui,sans-serif" font-size="10" fill="#71717a">点目录进入下一级</text>

  <rect x="516" y="360" width="36" height="22" rx="6" fill="none" stroke="#3f3f46"/><text x="525" y="375" font-family="system-ui,sans-serif" font-size="11" fill="#a1a1aa">取消</text>
  <rect x="420" y="360" width="86" height="22" rx="6" fill="#2563eb"/><text x="436" y="375" font-family="system-ui,sans-serif" font-size="10" fill="#fff">设为远程工作区</text>
</svg>