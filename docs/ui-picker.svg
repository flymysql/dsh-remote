<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430">
  <rect width="720" height="430" fill="#18181b"/>
  <text x="18" y="34" font-family="system-ui,sans-serif" font-size="14" fill="#fafafa" font-weight="600">选择工作区</text>

  <!-- tabs -->
  <rect x="18" y="48" width="64" height="26" rx="6" fill="#2563eb"/>
  <text x="50" y="66" font-family="system-ui,sans-serif" font-size="12" fill="#fff" font-weight="600" text-anchor="middle">本机</text>
  <rect x="88" y="48" width="64" height="26" rx="6" fill="#27272a" stroke="#3f3f46"/>
  <text x="120" y="66" font-family="system-ui,sans-serif" font-size="12" fill="#e4e4e7" text-anchor="middle">远程</text>

  <!-- 本机 -->
  <rect x="18" y="86" width="540" height="96" rx="8" fill="#1f1f23" stroke="#3f3f46"/>
  <text x="32" y="108" font-family="system-ui,sans-serif" font-size="11" fill="#a1a1aa">系统选择器优先；也可直接输入本机目录</text>
  <rect x="32" y="120" width="220" height="26" rx="6" fill="#27272a" stroke="#3f3f46"/>
  <text x="48" y="137" font-family="system-ui,sans-serif" font-size="10" fill="#71717a">C:\Users\you\project</text>
  <rect x="262" y="120" width="108" height="26" rx="6" fill="#2563eb"/>
  <text x="316" y="137" font-family="system-ui,sans-serif" font-size="11" fill="#fff" text-anchor="middle">选用此本地路径</text>
  <rect x="382" y="120" width="164" height="26" rx="6" fill="#27272a" stroke="#3f3f46"/>
  <text x="464" y="137" font-family="system-ui,sans-serif" font-size="10" fill="#e4e4e7" text-anchor="middle">打开系统文件夹选择器</text>
  <text x="32" y="164" font-family="system-ui,sans-serif" font-size="10" fill="#71717a">点击走 dsh-remote host 原生系统文件夹对话框</text>

  <!-- 远程 -->
  <rect x="18" y="188" width="540" height="210" rx="8" fill="#1f1f23" stroke="#3f3f46" opacity="0.55"/>
  <text x="32" y="212" font-family="system-ui,sans-serif" font-size="11" fill="#a1a1aa">远程机器</text>
  <rect x="96" y="198" width="150" height="24" rx="6" fill="#27272a" stroke="#3f3f46"/>
  <text x="171" y="214" font-family="ui-monospace,monospace" font-size="10" fill="#e4e4e7" text-anchor="middle">▾ 编译机1</text>
  <text x="270" y="214" font-family="ui-monospace,monospace" font-size="11" fill="#71717a">jimmycppliu@10.0.0.8:22</text>
  <rect x="402" y="196" width="72" height="26" rx="6" fill="#27272a" stroke="#3f3f46"/>
  <text x="438" y="213" font-family="system-ui,sans-serif" font-size="11" fill="#e4e4e7" text-anchor="middle">载入</text>
  <rect x="480" y="196" width="72" height="26" rx="6" fill="#27272a" stroke="#3f3f46"/>
  <text x="516" y="213" font-family="system-ui,sans-serif" font-size="11" fill="#e4e4e7" text-anchor="middle">上一级</text>

  <rect x="32" y="236" width="510" height="122" rx="6" fill="#17171a" stroke="#3f3f46"/>
  <text x="46" y="258" font-family="system-ui,sans-serif" font-size="11" fill="#4caf7d">📁 src</text>
  <text x="46" y="280" font-family="system-ui,sans-serif" font-size="11" fill="#4caf7d">📁 docs</text>
  <text x="46" y="302" font-family="system-ui,sans-serif" font-size="11" fill="#4caf7d">📁 tests</text>
  <text x="46" y="324" font-family="system-ui,sans-serif" font-size="11" fill="#e4e4e7">📄 package.json</text>
  <text x="46" y="346" font-family="system-ui,sans-serif" font-size="10" fill="#71717a">点目录进入下一级</text>

  <rect x="470" y="366" width="88" height="26" rx="6" fill="#2563eb"/>
  <text x="514" y="383" font-family="system-ui,sans-serif" font-size="11" fill="#fff" text-anchor="middle">设为远程工作区</text>
  <rect x="588" y="366" width="52" height="26" rx="6" fill="none" stroke="#3f3f46"/>
  <text x="614" y="383" font-family="system-ui,sans-serif" font-size="11" fill="#a1a1aa" text-anchor="middle">取消</text>
</svg>