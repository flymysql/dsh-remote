name: 功能建议 / Feature request
description: 想要的能力或体验改进 / A capability or experience you want
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    attributes:
      label: 想解决什么问题 / What problem does this solve
      placeholder: |
        描述你现在的痛点或绕路做法，而不只是想要的按钮。
    validations:
      required: true
  - type: textarea
    attributes:
      label: 设想的样子 / What it could look like
      description: 有草图/参考实现最好；没有也没关系
    validations:
      required: false
