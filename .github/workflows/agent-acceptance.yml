name: Agent workspace acceptance

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  agent:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dsh: 0.2.0-rc.2
            node: 22
            mode: native
          - dsh: 0.2.0-rc.2
            node: 22
            mode: ptc
          - dsh: 0.2.2-rc.1
            node: 24
            mode: native
          - dsh: 0.2.2-rc.1
            node: 24
            mode: ptc
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - name: Pack the actual candidate
        run: |
          mkdir -p "$RUNNER_TEMP/candidate"
          node scripts/prepare-npm-readme.mjs
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/candidate"
          node scripts/verify-release-package.mjs "$RUNNER_TEMP"/candidate/*.tgz
      - name: Install isolated host and candidate
        env:
          DSH_VERSION: ${{ matrix.dsh }}
        run: |
          # Pin host peers too: otherwise npm can hoist newer core services
          # next to an older CLI, producing a mixed-generation DSH profile.
          mapfile -t PEERS < <(node -e 'for (const name of Object.keys(require("./package.json").peerDependencies)) if (name.startsWith("@deepseek-ai/dsh-")) console.log(name + "@" + process.env.DSH_VERSION)')
          npm install --prefix "$RUNNER_TEMP/agent-host" "@deepseek-ai/dsh@$DSH_VERSION" "${PEERS[@]}" "$RUNNER_TEMP"/candidate/*.tgz --no-audit --no-fund --save-exact
          npm install --prefix "$RUNNER_TEMP/agent-browser" playwright@1.65.0 --no-audit --no-fund
          "$RUNNER_TEMP/agent-browser/node_modules/.bin/playwright" install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y bubblewrap
      - name: Test real agent, SSH and compiler
        env:
          IT_DSH_MODULES: ${{ runner.temp }}/agent-host/node_modules
        run: node --import ./test/setup-telemetry-off.mjs --test --test-timeout=40000 test/it-agent-workspace.test.js
      - name: Test actual Web conversation and remote diagnostics
        env:
          IT_DSH_MODULES: ${{ runner.temp }}/agent-host/node_modules
          IT_BROWSER_MODULES: ${{ runner.temp }}/agent-browser/node_modules
          IT_AGENT_ARTIFACTS: ${{ runner.temp }}/agent-artifacts
          TOOL_MODE: ${{ matrix.mode }}
        run: |
          export CHROMIUM_PATH="$(node -e 'console.log(require(process.env.IT_BROWSER_MODULES + "/playwright").chromium.executablePath())')"
          if [ "$TOOL_MODE" = ptc ]; then export IT_AGENT_PTC=1; fi
          node scripts/manual/agent-web-e2e.mjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: agent-${{ matrix.dsh }}-${{ matrix.mode }}
          path: ${{ runner.temp }}/agent-artifacts
