name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # 22+: the coverage job below needs `v8.takeCoverage()`, and this is also
          # the runtime users actually run DSH on.
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Syntax check
        run: |
          # Check every lib/*.js. A hand-maintained list silently drifts: it had
          # already missed binding.js, registry.js, update.js and (with PR #31)
          # http-transport.js, so a syntax error in a new file could reach main.
          for f in lib/*.js; do node --check "$f"; done
      - name: Reproduce licensed diff sources
        run: |
          node scripts/vendor-diff.mjs
          git diff --exit-code -- lib/vendor/jsdiff
      - name: Static framework gate
        run: node check.mjs
      - name: Unit tests
        run: npm test
      - name: Coverage (union over lib/*.js, gated)
        # 为什么不是 `--experimental-test-coverage`：本套测试刻意用 cache-busting
        # 的 `?host=…` 导入 lib/index.js（插件状态在模块级，共享实例会串味），
        # 而 V8 按 URL 聚合，于是同一个源文件被算成 N 份脚本 —— 加测试反而让
        # 百分比下降。scripts/coverage-union.mjs 按源文件取并集，是可信的数。
        run: npm run test:coverage:gate
      - name: Boot smoke (plugin loads in an isolated profile)
        run: bash scripts/boot-smoke.sh || echo "boot-smoke skipped (needs a desktop harness install)"

  test-infra:
    # The heartbeat worker (infra/heartbeat) is a standalone sub-project with no
    # dependency install; run its unit tests on every change.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Heartbeat worker unit tests
        working-directory: infra/heartbeat
        run: node --test --test-force-exit worker.test.mjs

  test-windows:
    # The maintainer develops on Windows — without this leg a POSIX-only
    # assertion stayed red locally by default, which erodes what "red" means.
    # Coverage stays on the ubuntu leg only (one authoritative number).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Syntax check
        shell: bash
        run: |
          for f in lib/*.js; do node --check "$f"; done
      - name: Reproduce licensed diff sources
        run: |
          node scripts/vendor-diff.mjs
          git diff --exit-code -- lib/vendor/jsdiff
      - name: Static framework gate
        run: node check.mjs
      - name: Unit tests
        run: npm test

  test-macos:
    # macOS is a first-class user platform, and its keychain backend
    # (`security` CLI) was the one credential path never exercised anywhere
    # (testing.md §7) — this leg runs it on every push.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Syntax check
        run: |
          for f in lib/*.js; do node --check "$f"; done
      - name: Reproduce licensed diff sources
        run: |
          node scripts/vendor-diff.mjs
          git diff --exit-code -- lib/vendor/jsdiff
      - name: Static framework gate
        run: node check.mjs
      - name: Unit tests
        run: npm test
